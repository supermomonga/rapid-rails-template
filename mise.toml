[tools]
ruby = "4.0.6"

[tasks.evidence-update]
description = "Devise版とSIWE版のja/en UIエビデンスを再生成する"
run = "rake evidence:update"

[tasks.evidence-verify]
description = "保存済みUIエビデンスの鮮度と整合性を検証する"
run = "rake evidence:verify"

[tasks.generate-sampleapp]
description = "sample/を再作成し、Devise認証のRailsアプリを生成する"
run = '''
#!/usr/bin/env ruby
require "fileutils"
require "rbconfig"

root = File.realpath(Dir.pwd)
sample = File.join(root, "sample")
FileUtils.rm_rf(sample)
exec RbConfig.ruby, File.join(root, "bootstrap.rb"),
  "--app-id=sample",
  "--app-name=Sample App",
  "--default-locale=ja",
  "--pwa=skip",
  "--web-push=skip",
  "--active-job=skip",
  "--maintenance-tasks=disable",
  "--solid-cache=use",
  "--account-authentication=devise",
  "--profile-features=screen_name,display_name,avatar",
  "--api=enable",
  "--action-cable=skip",
  "--mail=auto",
  "--deployment=dokploy",
  sample
'''

[tasks.generate-sampleapp-wallet-siwe]
description = "sample/を再作成し、Wallet SIWE認証のRailsアプリを生成する"
run = '''
#!/usr/bin/env ruby
require "fileutils"
