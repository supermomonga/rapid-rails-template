[tools]
ruby = "4.0.6"

[tasks.generate-sampleapp]
description = "sample/を再作成し、デフォルト選択肢でRailsアプリを生成する"
run = '''
#!/usr/bin/env ruby
require "fileutils"
require "rbconfig"

root = File.realpath(Dir.pwd)
sample = File.join(root, "sample")
FileUtils.rm_rf(sample)
exec RbConfig.ruby, File.join(root, "bootstrap.rb"), "--defaults", sample
'''
