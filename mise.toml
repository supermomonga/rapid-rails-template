[tools]
ruby = "4.0.6"

[tasks.evidence-update]
description = "全部入り日本語sampleのUIエビデンスを再生成する"
run = "rake evidence:update"

[tasks.evidence-verify]
description = "保存済みUIエビデンスの鮮度と整合性を検証する"
run = "rake evidence:verify"

[tasks.generate-sampleapp]
description = "sample/を再作成し、選択可能な機能をすべて有効にしたRailsアプリを生成する"
run = '''
#!/usr/bin/env ruby
require "fileutils"
require "rbconfig"

root = File.realpath(Dir.pwd)
sample = File.join(root, "sample")
FileUtils.rm_rf(sample)
generated = system RbConfig.ruby, File.join(root, "bootstrap.rb"),
  "--app-id=sample",
  "--app-name=Sample App",
  "--default-locale=ja",
  "--pwa=use",
  "--web-push=use",
  "--active-job=solid_queue",
  "--job-operations=enable",
  "--maintenance-tasks=enable",
  "--solid-cache=use",
  "--additional-login-methods=siwe",
  "--api=enable",
  "--action-cable=solid_cable",
  "--mail=use",
  sample
abort "sampleアプリの生成に失敗しました" unless generated

sample_template = File.join(root, "bin/sample-app-template")
sample_template_runner = File.join(root, "bin/apply-sample-app-template")
exec({ "BUNDLE_GEMFILE" => File.join(sample, "Gemfile") },
  "bundle", "exec", RbConfig.ruby, sample_template_runner, sample, sample_template)
'''
