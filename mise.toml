[tools]
ruby = "4.0.6"

[tasks.generate-sampleapp]
description = "sample/を再作成し、Devise認証のRailsアプリを生成する"
run = '''
#!/usr/bin/env ruby
require "fileutils"
require "rbconfig"

root = File.realpath(Dir.pwd)
sample = File.join(root, "sample")
FileUtils.rm_rf(sample)
exec RbConfig.ruby, File.join(root, "bootstrap.rb"),
  "--pwa=skip",
  "--web-push=skip",
  "--active-job=skip",
  "--solid-cache=use",
  "--account-authentication=devise",
  "--api=enable",
  "--action-cable=skip",
  "--mail=auto",
  "--action-text=use",
  "--deployment=dokploy",
  sample
'''

