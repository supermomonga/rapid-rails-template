[tools]
ruby = "4.0.6"

[tasks.evidence-update]
description = "全部入り日本語sampleのUIエビデンスを再生成する"
run = "rake evidence:update"

[tasks.evidence-verify]
description = "保存済みUIエビデンスの鮮度と整合性を検証する"
run = "rake evidence:verify"

[tasks.generate-sampleapp]
description = "sample/を再作成し、選択可能な機能をすべて有効にしたRailsアプリを生成する"
run = '''
#!/usr/bin/env ruby
require "fileutils"
require "rbconfig"
require "securerandom"

root = File.realpath(Dir.pwd)
sample = File.join(root, "sample")
FileUtils.rm_rf(sample)
imgproxy_environment = {
  "IMGPROXY_ENDPOINT" => "http://localhost:8080",
  "IMGPROXY_KEY" => SecureRandom.hex(32),
  "IMGPROXY_SALT" => SecureRandom.hex(32),
  "IMGPROXY_SOURCE_ORIGIN" => "http://host.docker.internal:3000"
}
exec imgproxy_environment, RbConfig.ruby, File.join(root, "bootstrap.rb"),
  "--app-id=sample",
  "--app-name=Sample App",
  "--default-locale=ja",
  "--pwa=use",
  "--web-push=use",
  "--active-job=solid_queue",
  "--job-operations=enable",
  "--maintenance-tasks=enable",
  "--solid-cache=use",
  "--additional-login-methods=siwe",
  "--profile-features=screen_name,display_name,avatar",
  "--image-delivery=imgproxy",
  "--api=enable",
  "--action-cable=solid_cable",
  "--mail=use",
  "--deployment=dokploy",
  sample
'''
