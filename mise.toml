  "--active-job=skip",
  "--maintenance-tasks=disable",
  "--solid-cache=use",
  "--account-authentication=wallet_siwe",
  "--profile-features=screen_name,display_name,avatar",
  "--api=enable",
  "--action-cable=skip",
  "--mail=auto",
  "--deployment=dokploy",
